<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400&display=swap");
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #121212;
        color: #e4e4e2;
        font-family: Inter, system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px 80px;
        position: relative;
      }
      /* no top rule: it read as a rendering artefact, and a gradient is a tell */
      .mark {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .dot {
        width: 10px;
        height: 10px;
        background: #f0f0eb;
      }
      h1 {
        margin: 0;
        font-size: 68px;
        line-height: 1.06;
        letter-spacing: -0.035em;
        font-weight: 600;
        max-width: 940px;
      }
      h1 span { color: inherit; }
      p {
        margin: 24px 0 0;
        font-size: 27px;
        line-height: 1.4;
        color: #b8b8b4;
        max-width: 820px;
      }
      .foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-family: "JetBrains Mono", monospace;
        font-size: 19px;
        color: #93938f;
        letter-spacing: 0.04em;
      }
      .foot b { color: #c9c9c4; font-weight: 400; }
    </style>
  </head>
  <body>
    <div class="mark"><div class="dot"></div>canonote</div>
    <div>
      <h1>A notebook your <span>agent can write into.</span></h1>
      <p>Agent edits arrive as suggestions. You accept or reject. Nothing changes silently.</p>
    </div>
    <div class="foot">
      <span><b>markdown</b> · local-first · no account</span>
      <span>MIT</span>
    </div>
  </body>
</html>
