<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Apply saved theme before paint to avoid a flash of the wrong palette -->
    <script>
      (function () {
        // Two themes, and only two: a third that looked the same as the other
        // two was a control that did nothing (2026-11-18).
        var valid = ['midnight', 'sepia'];
        var t = 'midnight';
        try {
          var saved = localStorage.getItem('app-theme');
          if (valid.indexOf(saved) !== -1) t = saved;
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png" />
